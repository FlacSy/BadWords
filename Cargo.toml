[workspace]
resolver = "2"
members = [
    "rust/badwords-core",
    "rust/badwords-py",
    "rust/badwords-wasm",
]

# Single source of truth for the version. scripts/sync_version.py copies it to
# pyproject.toml and the npm packages.
[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/FlacSy/badwords"
homepage = "https://badwords.flacsy.dev"
authors = ["FlacSy <flacsy.x@gmail.com>", "iamlostshe <vanamelcikov7275@gmail.com>"]

[workspace.dependencies]
badwords-core = { path = "rust/badwords-core", version = "3.0.0", default-features = false }

[package]
name = "badwords-examples"
version = "0.1.0"
edition = "2021"
publish = false

[[example]]
name = "rust_basic"
path = "examples/rust/rust_basic.rs"

[[example]]
name = "rust_chat_moderation"
path = "examples/rust/rust_chat_moderation.rs"

[[example]]
name = "rust_specific_languages"
path = "examples/rust/rust_specific_languages.rs"

[dependencies]
badwords-core = { path = "rust/badwords-core" }
