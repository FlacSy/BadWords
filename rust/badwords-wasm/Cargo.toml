[package]
name = "badwords-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly profanity filter - badwords for browser and Node.js"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://badwords.flacsy.dev"
# crates.io accepts at most five.
keywords = ["profanity", "filter", "moderation", "wasm", "webassembly"]
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
badwords-core = { workspace = true, features = ["embedded-words-min"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
