[package]
name = "badwords-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core profanity filter logic - normalization, transliteration, homoglyphs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://badwords.flacsy.dev"
keywords = ["profanity", "filter", "moderation", "content"]
categories = ["text-processing"]

# Everything the published crate needs, and nothing else.
include = [
    "src/**/*.rs",
    "resources/data/*.json",
    "resources/words/*.txt",
    "resources/words/SOURCES.md",
    "README.md",
    "LICENSE",
    "NOTICE",
]
authors.workspace = true

[features]
default = ["fs-resources", "embedded-data", "embedded-words"]
# Load resources from a directory at runtime.
fs-resources = []
# Compile the normalization tables and the language registry into the binary.
embedded-data = []
# Compile every shipped word list in (~250 KB).
embedded-words = ["embedded-data"]
# Compile only English and Russian in (~82 KB), for WebAssembly.
embedded-words-min = ["embedded-data"]
# Substring matching via Aho-Corasick.
substring = ["dep:aho-corasick"]

[lib]
crate-type = ["rlib"]

[[bench]]
name = "filter"
harness = false
required-features = ["substring"]

[dependencies]
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
strsim = "0.11"
aho-corasick = { version = "1.1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
strsim = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
