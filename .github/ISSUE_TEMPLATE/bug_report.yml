name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - badwords-py (Python)
        - badwords-core (Rust)
        - badwords-wasm (JavaScript/TypeScript)
        - "@badwords/languages"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "3.0.0"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest snippet that shows the problem. Please include the
        languages you load and the options you pass - detection behaviour
        depends on both.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python / Node / rustc version:
